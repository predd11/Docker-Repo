name: fourthworkflow
on:
 workflow_dispatch: 
 schedule:
  - cron: "5 * * * *"

jobs:
   myjob1:
    runs-on: windows-latest
    steps:
      - name: windows job
        run: write-host "Good Morning"
      - name: this is 2nd job
        run: ipconfig
   myjob2:
     runs-on: ubuntu-latest
     needs: myjob1
     steps:
        - name: this is linux job
          run: date
